<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RedLife Login</title>

    <link rel="stylesheet" href="login.css">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <div class="login-container">

        <!-- Left Side -->
        <div class="left-side">

            <!-- Background Video -->
            <video class="background-video" autoplay muted loop playsinline>
                <source src="./images/vecteezy_covid-19-virus-mutates-or-develops-a-strain-enter-the-body_7098044.mov">
            </video>

            <!-- Dark Overlay -->
            <div class="video-overlay"></div>

            <div class="content">

                <div class="logo">
                    <i class="fa-solid fa-droplet"></i>
                    <h2>RedLife</h2>
                </div>

                <h1>Donate Blood,<br>Save Lives</h1>

                <p>
                    Your small contribution can make a big difference.
                    Join RedLife and become a hero today.
                </p>

                <div class="blood-icon">
                    <i class="fa-solid fa-heart"></i>
                </div>

            </div>

        </div>


        <!-- Right Side Login -->
        <div class="right-side">

            <div class="login-box">

                <h1>Welcome Back!</h1>

                <p class="subtitle">
                    Login to continue saving lives.
                </p>


                <form>

                    <div class="input-box">

                        <label>Email Address</label>

                        <div class="input-field">

                            <i class="fa-solid fa-envelope"></i>

                            <input type="email" placeholder="Enter your email">

                        </div>

                    </div>


                    <div class="input-box">

                        <label>Password</label>

                        <div class="input-field">

                            <i class="fa-solid fa-lock"></i>

                            <input type="password" placeholder="Enter your password">

                        </div>

                    </div>


                    <div class="options">

                        <label>

                            <input type="checkbox">

                            Remember me

                        </label>

                        <a href="#">Forgot Password?</a>

                    </div>


                    <!-- <a href="about.html"><button>Login</button></a> -->
                    <button type="button" onclick="window.location.href='index.html'">
                        Login
                    </button>

                    <p class="register">

                        Don't have an account?

                        <a href="#">Sign Up</a>

                    </p>

                </form>

            </div>

        </div>

    </div>

</body>

</html>
